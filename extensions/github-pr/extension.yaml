name: github-pr
summary: Each task works on its own branch; once it passes, you choose a pull request or a push to main.

# Needs git and gh (signed in) on the machine.
#
#   run start          the workspace moves to the task's branch, task/<name>, created
#                      from the default branch the first time. A run won't start on top
#                      of uncommitted work on another branch. An existing task branch
#                      that is behind the default branch (doesn't contain it) is
#                      refused; set the run up again with --stale-branch to run on it
#                      as it is.
#   before the test    what the run changed is committed on the task branch.
#   test               the project's own @test, as always.
#   run passed         the tested commit is recorded; nothing is pushed or opened.
#
# Landing the work is a separate step the user asks for after the run: a pull request,
# or straight onto the default branch if that's a fast-forward. Either one refuses if
# the task branch has changed since its tests passed.
#
# Bringing a task branch up to date is also a step the user asks for: a rebase onto the
# default branch. If it conflicts it aborts and leaves the branch unchanged. An updated
# branch has to be tested again before it lands.
#
# A project whose tests are its CI on GitHub binds
#   test: { command: "ensign github-pr ci", plain: true }
# which pushes the branch and waits for every check on that commit; a failing check goes
# back to the coder with the end of its log. Its CI must run on pushes to task/**.

help:
  - say: '"open a pull request for <task>"'
    does: pushes the task's tested branch and opens its pull request
    run: ensign github-pr pull-request <project>/<task>
  - say: '"push <task> straight to main"'
    does: puts the task's tested commit on the main branch, with no pull request
    run: ensign github-pr merge <project>/<task>
  - say: '"update <task>''s branch"'
    does: rebases the task branch onto the default branch
    run: ensign github-pr update <project>/<task>

bindings:
  branch: { command: "ensign github-pr branch" }

events:
  run.start:          [{ require: "@branch" }]
  stage.before:test:  [{ require: "ensign github-pr commit" }]
  run.finish:success: [{ require: "ensign github-pr ready" }]
