name: release

# Cut a release: build ensign for every platform, tag the commit, and publish a GitHub
# release for the tag with the binaries and their SHA256SUMS attached, marked as a
# pre-release unless told otherwise. Binaries are never committed; bridges download
# the one for their platform from the release. Run it with
#   gh workflow run release -f version=0.1.0                     (a pre-release)
#   gh workflow run release -f version=1.0.0 -f prerelease=false (a full release)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must look like 1.2.3"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "v$VERSION already exists"; exit 1; fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          go vet ./...
          go test ./...
      - name: Build reproducibly
        run: |
          set -e
          repo="https://github.com/$GITHUB_REPOSITORY.git"
          mkdir -p dist
          for target in linux/amd64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X main.version=$TAG -X main.releaseRepo=$repo" \
              -o "dist/ensign-$os-$arch$ext" ./cmd/ensign
          done
          (cd dist && sha256sum ensign-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Tag
        run: |
          git tag "$TAG"
          git push origin "$TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $flag dist/*
