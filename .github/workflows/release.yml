name: release

# Cut a release: build ensign for every platform, commit the binaries, tag that commit
# (so a tagged checkout always contains its own binaries), and publish a GitHub release
# for the tag, marked as a pre-release unless told otherwise. Run it with
#   gh workflow run release -f version=0.1.0                     (a pre-release)
#   gh workflow run release -f version=1.0.0 -f prerelease=false (a full release)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must look like 1.2.3"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "v$VERSION already exists"; exit 1; fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          go vet ./...
          go test ./...
      - name: Build reproducibly
        run: |
          set -e
          rm -rf bin
          for target in linux/amd64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X main.version=$TAG" \
              -o "bin/$os-$arch/ensign$ext" ./cmd/ensign
          done
          (cd bin && sha256sum */ensign* > SHA256SUMS)
          cat bin/SHA256SUMS
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin
          git commit -m "Release $TAG"
          git tag "$TAG"
          git push origin HEAD:master "$TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          # The binaries also go on the release page, named by platform. Bridges don't
          # need them there: they clone the tag, which carries bin/.
          mkdir -p dist
          for f in bin/*/ensign*; do
            p=$(basename "$(dirname "$f")"); ext=""
            case "$f" in *.exe) ext=.exe ;; esac
            cp "$f" "dist/ensign-$p$ext"
          done
          (cd dist && sha256sum ensign-* > SHA256SUMS)
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $flag dist/*
