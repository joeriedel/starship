pipeline: coding
version: 1
summary: Implement a scoped change through code, review, style, test and documentation, looping until it builds and passes.
requires-bindings: [build, test]
budgets: { coder-loop: 3, test: 3 }
free-roles: [explorer]

help:
  - say: "\"pull the other machine's changes and make sure they build and pass\""
    does: sync the workspace, test it, and fix anything that fails
    run: ensign run <project>/<task> --sync --start test
  - say: "\"update the docs for this task's work\""
    does: runs the documentation pass by itself and tests nothing, so a task already tested stays tested, and one that isn't needs --start test before it is published
    run: ensign run <project>/<task> --start docs

stages:
  - id: run
    role: orchestrator
    dispatched-by: session
    stages:
      - id: code
        role: coder
        spend: coder-loop
        outcomes:
          compiled: next
          broken:   { goto: code }
          blocked:  { error: blocked }
      - id: review
        role: reviewer
        parallel: { over: dimensions, join: all }
        dimensions: [correctness]
        outcomes:                     # precedence order: the join takes the first any branch reported
          findings: { goto: code }
          clean:    next
      - id: style
        role: style-reviewer
        outcomes:
          done: next
      - id: test
        role: tester
        outcomes:
          pass:  next
          fail:  { goto: code, spend: test, reset: coder-loop }
          error: { error: test-error }
      - id: docs
        role: documentation
        report-fields: [files]
        outcomes:
          updated:   { finish: success }
          unchanged: { finish: success }
          blocked:   { error: blocked }
        skip: { unless-binding: docs, outcome: unchanged }

on-exhausted:
  coder-loop: { error: "budget:coder-loop" }
  test: { error: "budget:test" }
