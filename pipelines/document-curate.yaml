# One stage: the curator folds proposals into each declared document with pending proposals. With no pending proposals the stage takes its empty outcome without a dispatch.

pipeline: document-curate
version: 1
scope: bridge
summary: Fold the proposals made for the bridge's declared documents into them.

help:
  - say: '"curate the documents"'
    does: fold the proposals made for the bridge's declared documents into them
    run: ensign run --pipeline document-curate
  - say: '"curate <document>" (one document)'
    does: fold the proposals made for that one document into it; nothing else is curated
    run: ensign run --pipeline document-curate --document <document>

stages:
  - id: curate
    role: curator
    dispatched-by: session
    brief: briefs/curate-document.md
    curates: document
    parallel: { over: pending-documents, join: all, empty: unchanged }
    outcomes:
      updated:   { finish: success }
      unchanged: { finish: success }
